
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Form</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="sidebar">
    <h2>ShopAdmin</h2>
    <p class="sidebar-subtitle">Management System</p>
    <nav>
        <a href="{{ url_for('home') }}">Dashboard</a>
        <a href="{{ url_for('products') }}">Products</a>
        <a href="{{ url_for('customers') }}" class="active">Customers</a>
        <a href="{{ url_for('orders') }}">Orders</a>
        <a href="{{ url_for('revenue') }}">Revenue & Payments</a>
    </nav>
    <div class="sidebar-footer">E-Commerce Management</div>
</div>

<div class="main-content" style="max-width:850px;">

    <header>
        <div>
            <h1>{{ 'Edit Customer' if customer else 'Add New Customer' }}</h1>
            <p>Enter customer information below</p>
        </div>
    </header>

    <section class="table-section">

        <form method="POST">

            <label>First Name</label>
            <input type="text" name="first_name"
                   value="{{ customer.first_name if customer else '' }}"
                   required maxlength="50">

            <label>Last Name</label>
            <input type="text" name="last_name"
                   value="{{ customer.last_name if customer else '' }}"
                   required maxlength="50">

            <label>Email</label>
            <input type="email" name="email"
                   value="{{ customer.email if customer else '' }}"
                   required maxlength="100">

            <label>Phone</label>
            <input type="text" name="phone"
                   value="{{ customer.phone if customer else '' }}"
                   maxlength="15">

            <label>Address</label>
            <textarea name="address" rows="3">{{ customer.address if customer else '' }}</textarea>

            <label>City</label>
            <input type="text" name="city"
                   value="{{ customer.city if customer else '' }}"
                   maxlength="50">

            <label>State</label>
            <input type="text" name="state"
                   value="{{ customer.state if customer else '' }}"
                   maxlength="50">

            <label>Postal Code</label>
            <input type="text" name="postal_code"
                   value="{{ customer.postal_code if customer else '' }}"
                   maxlength="10">

            <button type="submit" class="action-btn">
                {{ 'Update Customer' if customer else 'Save Customer' }}
            </button>

            <a href="{{ url_for('customers') }}" class="back-link">Cancel</a>

        </form>

    </section>

</div>

</body>
</html>
